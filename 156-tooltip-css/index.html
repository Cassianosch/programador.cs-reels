<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>156 — Tooltips em CSS puro — @programador.cs</title>
    <link rel="stylesheet" href="./estilos.css">
</head>

<body>
    <div class="row">
        <button class="tip" data-tip="Salvar documento" data-dir="top" type="button">💾</button>
        <button class="tip" data-tip="Editar" data-dir="right" type="button">✏️</button>
        <button class="tip" data-tip="Excluir item" data-dir="bottom" type="button">🗑️</button>
        <button class="tip" data-tip="Compartilhar" data-dir="left" type="button">🔗</button>
    </div>
    <p class="note">Passe o mouse ou foque com Tab — tooltip aparece na direção do atributo <code>data-dir</code>.</p>
</body>

</html>
