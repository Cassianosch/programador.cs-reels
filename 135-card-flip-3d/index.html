<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>135 — Card flip 3D — @programador.cs</title>
    <link rel="stylesheet" href="./estilos.css">
</head>

<body>
    <div class="scene">
        <div class="card" tabindex="0" role="button" aria-label="Virar card">
            <div class="card__inner">
                <div class="card__face card__face--front">
                    <span class="emoji" aria-hidden="true">🚀</span>
                    <h2>Frente</h2>
                    <p>Passe o mouse ou foque com Tab + Enter.</p>
                </div>
                <div class="card__face card__face--back">
                    <span class="emoji" aria-hidden="true">✨</span>
                    <h2>Verso</h2>
                    <p>Só CSS: <code>transform-style: preserve-3d</code></p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
