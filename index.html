  <style>
    /* ── reset ── */
    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, p { margin: 0; }

    /* ── tokens ── */
    :root {
      --bg: #050508;
      --surface: #111116;
      --surface-hover: #1a1a22;
      --border: rgba(255,255,255,.06);
      --border-hover: rgba(255,255,255,.12);
      --text: #e4e4e7;
      --muted: #71717a;
      --accent: #818cf8;
      --accent-glow: rgba(129,140,248,.15);
      --radius: .85rem;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* ── base ── */
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    /* ── header ── */
    .header {
      position: sticky; top: 0; z-index: 30;
      background: rgba(5,5,8,.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .header__inner {
      max-width: 1120px; margin: 0 auto;
      padding: .85rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: .65rem;
    }
    .brand {
      font-weight: 800; font-size: 1.15rem; letter-spacing: -.02em;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .brand span { color: var(--muted); font-weight: 500; font-size: .85rem; background: none; -webkit-text-fill-color: var(--muted); }
    .ig-link {
      color: var(--muted); text-decoration: none; font-size: .82rem;
      transition: color .2s;
    }
    .ig-link:hover { color: var(--accent); }

    /* ── toolbar ── */
    .toolbar {
      max-width: 1120px; margin: 0 auto;
      padding: 1.25rem 1.25rem .35rem;
      display: flex; flex-wrap: wrap; gap: .65rem; align-items: center;
    }
    .search {
      flex: 1; min-width: 200px;
      padding: .6rem .85rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: .92rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search::placeholder { color: var(--muted); }
    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .count {
      font-size: .82rem; color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ── tags ── */
    .tags {
      max-width: 1120px; margin: 0 auto;
      padding: .65rem 1.25rem;
      display: flex; flex-wrap: wrap; gap: .35rem;
      -webkit-overflow-scrolling: touch;
    }
    .tag {
      padding: .3rem .7rem; border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      font-size: .75rem; font-weight: 600; font-family: inherit;
      cursor: pointer; white-space: nowrap;
      transition: all .2s;
    }
    .tag:hover { border-color: var(--border-hover); color: var(--text); }
    .tag.is-active {
      background: var(--accent); border-color: var(--accent);
      color: #050508;
    }

    /* ── grid ── */
    .grid {
      max-width: 1120px; margin: 0 auto;
      padding: .85rem 1.25rem 3rem;
      display: grid; gap: .65rem;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    }

    /* ── card ── */
    .card {
      display: flex; flex-direction: column;
      padding: 1rem 1.1rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      text-decoration: none; color: inherit;
      transition: transform .22s cubic-bezier(.22,1,.36,1),
                  border-color .22s,
                  box-shadow .22s,
                  background .22s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
      background: var(--surface-hover);
      box-shadow: 0 18px 40px rgba(0,0,0,.25);
    }
    .card__num {
      font-size: .68rem; font-weight: 700;
      color: var(--accent); letter-spacing: .08em;
      text-transform: uppercase; margin-bottom: .3rem;
    }
    .card__title {
      font-size: .95rem; font-weight: 600; line-height: 1.35;
      margin-bottom: .4rem;
    }
    .card__tags {
      margin-top: auto; padding-top: .4rem;
      display: flex; flex-wrap: wrap; gap: .3rem;
    }
    .card__tag {
      font-size: .65rem; font-weight: 600;
      padding: .15rem .4rem; border-radius: 999px;
      background: rgba(129,140,248,.1); color: var(--accent);
    }

    /* ── empty state ── */
    .empty {
      grid-column: 1 / -1;
      text-align: center; padding: 4rem 1rem;
      color: var(--muted);
    }
    .empty span { font-size: 2rem; display: block; margin-bottom: .5rem; }

    /* ── fade-in ── */
    .card { animation: rise .35s ease both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .card:hover { transform: none; }
    }

    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

const grid = document.getElementById("grid");
const searchEl = document.getElementById("search");
const countEl = document.getElementById("count");
const tagsEl = document.getElementById("tags");

// build tag set
const allTags = [...new Set(PROJECTS.flatMap(p => p.tags))].sort();
let activeTag = null;

allTags.forEach(t => {
  const btn = document.createElement("button");
  btn.className = "tag";
  btn.textContent = t;
  btn.addEventListener("click", () => {
    activeTag = activeTag === t ? null : t;
    tagsEl.querySelectorAll(".tag").forEach(b => b.classList.toggle("is-active", b.textContent === activeTag));
    render();
  });
  tagsEl.appendChild(btn);
});

function render() {
  const q = searchEl.value.toLowerCase().trim();
  const filtered = PROJECTS.filter(p => {
    const matchSearch = !q || p.title.toLowerCase().includes(q) || p.folder.toLowerCase().includes(q) || p.tags.some(t => t.includes(q));
    const matchTag = !activeTag || p.tags.includes(activeTag);
    return matchSearch && matchTag;
  });

  grid.innerHTML = "";

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty"><span>🔍</span>Nenhum projeto encontrado.</div>`;
    countEl.textContent = "0 projetos";
    return;
  }

  countEl.textContent = `${filtered.length} projeto${filtered.length > 1 ? "s" : ""}`;

  filtered.forEach((p, i) => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = `./${p.folder}/index.html`;
    a.style.animationDelay = `${Math.min(i * 25, 400)}ms`;
    a.innerHTML = `
      ${p.num != null ? `<span class="card__num">#${p.num}</span>` : `<span class="card__num">—</span>`}
      <h2 class="card__title">${p.title}</h2>
      <div class="card__tags">${p.tags.map(t => `<span class="card__tag">${t}</span>`).join("")}</div>
    `;
    grid.appendChild(a);
  });
}

searchEl.addEventListener("input", render);
render();
</script>
