<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>143 — Barra de progresso animada — @programador.cs</title>
    <link rel="stylesheet" href="./estilos.css">
</head>

<body>
    <div class="wrap">
        <h1>Download simulado</h1>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"
            aria-label="Progresso">
            <div class="progress__fill" id="fill"></div>
        </div>
        <p class="pct" id="pct">0%</p>
        <button type="button" class="btn" id="start">Iniciar</button>
    </div>
    <script src="./script.js"></script>
</body>

</html>
