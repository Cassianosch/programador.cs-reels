<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>160 — Loadings criativos — @programador.cs</title>
    <link rel="stylesheet" href="./estilos.css">
</head>

<body>
    <h1>Loadings em CSS puro</h1>
    <div class="grid">
        <!-- 1: barras dançantes -->
        <div class="cell" aria-label="Carregando">
            <div class="bars">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <p>Barras</p>
        </div>

        <!-- 2: anel giratório -->
        <div class="cell" aria-label="Carregando">
            <div class="ring"></div>
            <p>Anel</p>
        </div>

        <!-- 3: pontos pulsantes -->
        <div class="cell" aria-label="Carregando">
            <div class="dots">
                <span></span><span></span><span></span>
            </div>
            <p>Pontos</p>
        </div>

        <!-- 4: quadrado giratório -->
        <div class="cell" aria-label="Carregando">
            <div class="cube"></div>
            <p>Cubo</p>
        </div>
    </div>
</body>

</html>
