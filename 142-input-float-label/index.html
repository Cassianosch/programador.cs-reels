<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>142 — Label flutuante no input — @programador.cs</title>
    <link rel="stylesheet" href="./estilos.css">
</head>

<body>
    <form class="form" autocomplete="off">
        <h1>Entrar</h1>
        <div class="field">
            <input class="field__input" type="email" id="email" placeholder=" " required>
            <label class="field__label" for="email">E-mail</label>
        </div>
        <div class="field">
            <input class="field__input" type="password" id="senha" placeholder=" " required minlength="4">
            <label class="field__label" for="senha">Senha</label>
        </div>
        <button type="submit" class="btn">Continuar</button>
    </form>
</body>

</html>
