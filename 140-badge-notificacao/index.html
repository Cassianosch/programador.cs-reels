<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>140 — Badge de notificação — @programador.cs</title>
    <link rel="stylesheet" href="./estilos.css">
</head>

<body>
    <div class="row">
        <button type="button" class="icon-btn" aria-label="Mensagens">
            <span class="icon" aria-hidden="true">💬</span>
            <span class="badge">3</span>
        </button>
        <button type="button" class="icon-btn" aria-label="Alertas">
            <span class="icon" aria-hidden="true">🔔</span>
            <span class="badge badge--pulse">12</span>
        </button>
    </div>
</body>

</html>
